[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Engine lives in its own repository next to this folder.
phalanx_core = { path = "../phalanx/crates/phalanx_core" }
phalanx_sim = { path = "../phalanx/crates/phalanx_sim" }
phalanx_client = { path = "../phalanx/crates/phalanx_client" }
dotwars_sim = { path = "crates/dotwars_sim" }
hecs = "0.10"
macroquad = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

# Sim speed matters even in debug builds.
[profile.dev.package."*"]
opt-level = 2
